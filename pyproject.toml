[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-webpage"
version = "0.2.0"
description = "為 FastAPI 打造的現代化網頁渲染套件 (Modern web rendering package for FastAPI using Jinja2)"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.22",
    "ujson>=5.11.0",
]
